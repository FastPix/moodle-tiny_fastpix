name: moodle-plugin-ci

on:
  push:
    branches: [main, '2026-*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE']
        # Both engines are exercised: a PostgreSQL failure is a Plugins-directory
        # approval blocker, so it must run in CI, not just MariaDB.
        database: ['mariadb', 'pgsql']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, zip, soap, intl, xmlrpc
          ini-values: max_input_vars=5000
          coverage: pcov

      # Moodle 4.5's Grunt toolchain requires Node 22; needed for the grunt step
      # (rebuilds amd/src -> amd/build and fails if the committed artifacts differ).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin && pwd)" >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      # tiny_fastpix depends on local_fastpix + mod_fastpix + filter_fastpix
      # (see version.php). A clean CI runner has none of them, so the install
      # would fail without them. These pull the three from their FastPix repos.
      - name: Add dependent FastPix plugins
        run: |
          moodle-plugin-ci add-plugin FastPix/moodle-local_fastpix
          moodle-plugin-ci add-plugin FastPix/moodle-mod_fastpix
          moodle-plugin-ci add-plugin FastPix/moodle-filter_fastpix

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # P0 layering invariant: this plugin must never talk to FastPix directly —
      # asset listing, uploads and polling all route through local_fastpix.
      # A literal fastpix.io reference in plugin source is a layering violation.
      # The copyright email (support@fastpix.io) is excluded so it doesn't
      # false-positive the gate.
      - name: No-FastPix-HTTP guard
        if: ${{ !cancelled() }}
        run: |
          if grep -rnI 'fastpix\.io' plugin \
               --include='*.php' --include='*.js' --include='*.mustache' \
               | grep -v '@fastpix\.io'; then
            echo "::error::Direct fastpix.io reference found — uploads/listing must route through local_fastpix."
            exit 1
          fi
          echo "No-FastPix-HTTP guard passed."

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP copy/paste detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP mess detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Coverage gate (overall 85% / get_my_videos 90%)
        # One representative job only — coverage is DB-independent, so it need
        # not run on every (php, database) combination.
        if: ${{ !cancelled() && matrix.php == '8.3' && matrix.database == 'mariadb' }}
        working-directory: plugin
        run: bash tools/coverage.sh
